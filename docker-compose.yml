version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tred-assistant
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - PRICE_RELAY_SECRET=${PRICE_RELAY_SECRET}
      - HOST=0.0.0.0
      - PORT=3000
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tred.rule=Host(`${TRED_DOMAIN:-tred.yourdomain.com}`)"
      - "traefik.http.routers.tred.entrypoints=websecure"
      - "traefik.http.routers.tred.tls.certresolver=letsencrypt"
      - "traefik.http.services.tred.loadbalancer.server.port=3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tred-worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    command: ["npx", "tsx", "worker/execution-worker.ts"]
    restart: unless-stopped
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true
